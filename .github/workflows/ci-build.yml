name: CI Build Validation

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  PACKAGE_PROJECT: src/Casko.HttpHeadersForUmbraco.Package/Casko.HttpHeadersForUmbraco.Package.csproj
  TEST_PROJECT: src/Casko.HttpHeadersForUmbraco.Tests/Casko.HttpHeadersForUmbraco.Tests.csproj

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore package and tests
        run: dotnet restore "${{ env.TEST_PROJECT }}"

      - name: Run tests
        run: dotnet test "${{ env.TEST_PROJECT }}" --configuration Release --no-restore

      - name: Validate NuGet package
        run: dotnet pack "${{ env.PACKAGE_PROJECT }}" --configuration Release --no-build --no-restore --output ./artifacts
